name: deploy-mcp
# Deploys mcp/worker.js to Cloudflare Workers (free tier). Needs these repository secrets:
#   CLOUDFLARE_API_TOKEN  (template "Edit Cloudflare Workers"), CLOUDFLARE_ACCOUNT_ID,
#   GH_PAT (fine-grained token for this repo: Actions read/write, Contents read/write), MCP_SECRET (long random string)
on:
  push:
    branches: [main]
    paths: ["mcp/**", "skill/SKILL.md", "skill/references/**", "skill/assets/channel-schema.json"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle the guide from the skill
        run: python3 mcp/build_guide.py
      - name: Check required secrets are set
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MCP_SECRET: ${{ secrets.MCP_SECRET }}
        run: |
          for v in CF_TOKEN CF_ACCOUNT GH_PAT MCP_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret for $v is missing or empty"; exit 1; fi
          done
      # Deploy FIRST so the Worker exists, then attach secrets (wrangler-action's `secrets:` runs before deploy and fails on a new Worker).
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: mcp
          command: deploy --var REPO:${{ github.repository }}
      - name: Set Worker secrets
        working-directory: mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MCP_SECRET: ${{ secrets.MCP_SECRET }}
        run: |
          printf '%s' "$GH_PAT"     | npx --yes wrangler@3 secret put GH_PAT
          printf '%s' "$MCP_SECRET" | npx --yes wrangler@3 secret put MCP_SECRET
